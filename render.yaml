# Render blueprint: New + > Blueprint, point it at this repo (branch main).
# Free plan, no persistent disk: accounts/purchases live in the container and reset on every
# deploy or spin-down. For persistence switch to a paid plan and add:
#   disk: { name: accounts, mountPath: /var/data, sizeGB: 1 }   and   DB_DIR=/var/data
services:
  - type: web
    name: mopeio-local
    runtime: docker
    plan: free
    healthCheckPath: /master/servers
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false        # paste your OAuth Web client id in the Render dashboard
      - key: MOPE_INFINITE_EMAILS
        sync: false        # optional: comma-separated emails with unlimited coins/gems
      - key: MOPE_FREE_SHOP
        value: "1"
