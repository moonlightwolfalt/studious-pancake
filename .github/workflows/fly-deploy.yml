# Deploys to Fly.io from GitHub (no local CLI needed).
# One-time setup in GitHub: Settings > Secrets and variables > Actions > New repository secret
#   FLY_API_TOKEN      (required)  a Fly token from the Fly dashboard
#   GOOGLE_CLIENT_ID   (optional)  OAuth web client id for Google login
# Run it: Actions tab > "Fly Deploy" > Run workflow  (it also runs on every push to main)
name: Fly Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: fly-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then echo "::error::Add the FLY_API_TOKEN repository secret first"; exit 1; fi

      # first deploy only: the volume that holds accounts. Fails harmlessly if it already exists.
      - name: Create volume (once)
        run: flyctl volumes create accounts --size 1 --region iad --yes -a studious-pancake || echo "volume exists or could not be created, continuing"

      - name: Set Google client id (if provided)
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          if [ -n "$GOOGLE_CLIENT_ID" ]; then flyctl secrets set GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" -a studious-pancake --stage; fi

      - name: Deploy
        run: flyctl deploy --remote-only --dockerfile Dockerfile --no-cache -a studious-pancake

      # game worlds live in memory: exactly one machine
      - name: Keep one machine
        run: flyctl scale count 1 --yes -a studious-pancake
