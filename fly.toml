# fly.toml app configuration file generated for studious-pancake on 2026-10-25T03:05:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'studious-pancake'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_DIR = '/data'
  MOPE_FREE_SHOP = '1'
  PORT = '8080'

[[mounts]]
  source = 'accounts'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/master/servers'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
